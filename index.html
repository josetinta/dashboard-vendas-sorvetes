*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#3b2218;font-family:'Figtree','Segoe UI',Roboto,Arial,sans-serif;color:#171717}
#stage{position:absolute;left:0;top:0;width:1494px;height:840px;transform-origin:0 0;overflow:hidden;background:#3b2218}
#stage>*,#dyn>*{position:absolute}
.bx>*{position:absolute}
svg{display:block;overflow:visible}
svg text{font-family:'Figtree','Segoe UI',Arial,sans-serif}
a{text-decoration:none;color:inherit}
.rw{cursor:pointer}
.sf{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-variant-numeric:lining-nums}
.lang{width:34px;height:28px;line-height:26px;text-align:center;border:1px solid #d9d9d9;background:#fff;color:#444;font-size:11.5px;font-weight:700;cursor:pointer;border-radius:14px}
.lang:hover{background:#f6e8dc}.lang.on{background:#6b3420;color:#fff;border-color:#6b3420}
.sp{display:flex;align-items:center;justify-content:center;height:26px;border-radius:13px;font-size:11.5px;font-weight:700;border:1px solid;white-space:nowrap}
.sp.em{background:#f4f4f4;border-color:#dcdcdc;color:#333}.sp.yt{background:#fde8e6;border-color:#f7b9b3;color:#c4261b}.sp.li{background:#e3effa;border-color:#a9cdee;color:#0a5aa8}.sp.pf{background:#fff0e8;border-color:#f6bf9f;color:#6b3420}.sp.wa{background:#e2f6e9;border-color:#a2dcb8;color:#16803f}
.sp:hover{filter:brightness(.95)}
.ib{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#f1f1f1;cursor:pointer;color:#333}
.ib:hover{background:#ecd5c1}
.ch{height:24px;line-height:23px;padding:0 11px;border-radius:12px;border:1px solid #e0e0e0;background:#fff;font-size:11.5px;font-weight:600;cursor:pointer;color:#555;white-space:nowrap}
.ch.on{background:#171717;color:#fff;border-color:#171717}
#tip{position:fixed;z-index:90;pointer-events:none;display:none;background:#171717;color:#fff;font:600 12.5px 'Figtree','Segoe UI',Arial;padding:5px 10px;white-space:nowrap;border-radius:8px}
#tbl{position:fixed;inset:0;z-index:80;background:rgba(20,20,20,.6);display:none;align-items:center;justify-content:center}
#tbl.show{display:flex}
#sheet{width:min(960px,96vw);height:min(560px,90vh);background:#fff;border:1px solid #6b3420;border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
#sheet .tp{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#faf1e8;border-bottom:1px solid #e8d2bf}
#sheet .tp b{flex:1;font-size:16px;color:#6b3420}
#sheet button{height:30px;padding:0 14px;border:1px solid #6b3420;border-radius:8px;background:#fff;color:#6b3420;font-weight:700;cursor:pointer;font-family:inherit}
#sheet button:hover{background:#6b3420;color:#fff}
#sheet .scr{flex:1;overflow:auto}
#sheet table{border-collapse:collapse;font-size:13px;width:100%}
#sheet th{position:sticky;top:0;background:#faf1e8;color:#6b3420;padding:8px 10px;text-align:right;white-space:nowrap;border:1px solid #f1e3dc}
#sheet td{padding:6px 10px;border:1px solid #f0eaea;text-align:right;color:#222;white-space:nowrap}
#sheet th:first-child,#sheet td:first-child,#sheet th:nth-child(2),#sheet td:nth-child(2){text-align:left}
#sheet td[contenteditable]:focus{outline:2px solid #6b3420;background:#fffaf5}
</style></head>
